[project]
name = "fipro"
version = "0.1.0"
requires-python = ">=3.14"

# Runtime/application dependencies (PEP 621)
dependencies = [
  "ipykernel==6.30.1"
]

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-exact = true

[tool.hatch.build.targets.wheel]
bypass-selection	= true
