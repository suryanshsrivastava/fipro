[project]
name = "fipro"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
  "gspread>=6.2.1",
  "google-auth>=2.49.0",
  "ipykernel>=6.30.1",
  "pandas>=2.3.3",
  "xlrd>=2.0.2",
  "openpyxl>=3.0.9",
  "numpy>=1.24.2",
  "tomli>=2.0.1",
]

[project.scripts]
fipro = "src.main:main"

[build-system]
requires = ["uv_build >= 0.9.11, <0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "src"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.17",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "vulture>=2.11",
]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = ["legacy", ".fipro-env", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --cov=src --cov-report=term-missing"
markers = [
  "integration: end-to-end tests that run the full pipeline against fixture data",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/ui/dashboard.py"]

[tool.coverage.report]
# Baseline gate. PRD section 14.1 targets 80%; raise this as tests are added.
# Do not lower. See docs/plans/2026-04-14-agent-ready-minimum.md for the ratchet plan.
fail_under = 50
show_missing = true
skip_covered = false

[tool.vulture]
paths = ["src"]
min_confidence = 80
exclude = ["src/ui/dashboard.py"]
