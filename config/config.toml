# Configuration file for Fipro

[fipro]
version = "0.1.0"
log_level = "INFO"

[paths]
# `data` is a symlink to the statement corpus (~/Documents/Finances/data): the source of truth,
# read-only as far as this program is concerned. Nothing is moved, renamed or deleted and every run
# re-exports the whole corpus.
input = "data"
# Everything else lives under corpus/ (gitignored, like data/): output/ is rebuilt every run, state/
# holds files that cannot be regenerated, legacy/ is the old pre-symlink copy.
output = "corpus/output"
dashboard_data = "corpus/output/dashboard_data.csv"
password_hints = "corpus/state/password_hints.json"
# Bank -> statement password, so locked statements can be processed without re-entering them.
# Holds the passwords themselves (unlike password_hints, which holds only the hint sentence).
statement_passwords = "corpus/state/statement_passwords.json"
# Hand-maintained labels (status, category, need/want, frequency, splitwise, notes). annotations.csv is keyed by
# transaction hash; category_rules.csv maps a counterparty to a category. Both must survive re-runs.
annotations = "corpus/state/annotations.csv"
category_rules = "corpus/state/category_rules.csv"

[processing]
supported_extensions = ["xls", "xlsx"]
skip_internal_transfers = false

[banks.hdfc]
name = "HDFC"
patterns = ["*hdfc*", "*HDFC*"]
date_format = "%d/%m/%y"

[banks.sbi]
name = "SBI"
patterns = ["*sbi*", "*SBI*"]
date_format = "%d %b %Y"

[banks.axis]
name = "AXIS"
patterns = ["*axis*", "*Axis*"]
date_format = "%d-%m-%Y"

[export.goodbudget]
default_envelope = "Unallocated"
default_status = "cleared"
max_description_length = 50

[external_accounts]
names = ["CREDIT_CARD"]
payment_keywords = ["CREDIT CARD", "CC PAYMENT", "CARD PAYMENT", "CRED"]

# `fipro gmail`: read-only Gmail search for the email that explains each bank's
# statement password rule. Only the hint sentence is saved (paths.password_hints).
[gmail]
credentials = "config/gmail_credentials.json"   # OAuth "Desktop app" client JSON (gitignored)
token = "config/gmail_token.json"               # created on first consent (gitignored)
max_messages = 10

[gmail.queries]
# Gmail search syntax; adjust if your bank's sender differs.
SBI = "from:sbi.co.in password"
HDFC = "from:hdfcbank.net password"
AXIS = "from:axisbank.com password"
