# Configuration file for Fipro

[fipro]
version = "0.1.0"
log_level = "INFO"

[paths]
input = "data/input"
output = "data/output"
processed = "data/processed"
failed = "data/failed"

[processing]
supported_extensions = ["xls", "xlsx"]
skip_internal_transfers = false

[banks.hdfc]
name = "HDFC"
patterns = ["*hdfc*", "*HDFC*"]
date_format = "%d/%m/%y"

[banks.sbi]
name = "SBI"
patterns = ["*sbi*", "*SBI*"]
date_format = "%d %b %Y"

[banks.axis]
name = "AXIS"
patterns = ["*axis*", "*Axis*"]
date_format = "%d-%m-%Y"

[export.goodbudget]
default_envelope = "Unallocated"
default_status = "cleared"
max_description_length = 50

[summary]
top_n = 5
