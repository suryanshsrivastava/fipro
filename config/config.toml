[fipro]
version = "0.1.0"
log_level = "INFO"

[paths]
input = "data/input"
output = "data/output"
processed = "data/processed"
failed = "data/failed"
log_file = "logs/fipro.log"

[processing]
supported_extensions = ["xls", "xlsx"]
include_internal_transfers = true
fail_on_file_error = true

[banks.hdfc]
patterns = ["*hdfc*", "*HDFC*"]

[banks.sbi]
patterns = ["*sbi*", "*SBI*"]

[banks.axis]
patterns = ["*axis*", "*Axis*"]

[external_accounts]
names = ["CREDIT_CARD"]
payment_keywords = ["CREDIT CARD", "CC PAYMENT", "CARD PAYMENT", "CRED"]
