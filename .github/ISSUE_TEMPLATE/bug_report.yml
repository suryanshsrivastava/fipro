name: Bug report
description: Report a reproducible defect in parsing, pipeline, export, or CLI behavior.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please provide enough detail to reproduce.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: Concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Include exact commands and file conditions.
      placeholder: |
        1. Place statement in data/input/...
        2. Run `uv run fipro process`
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Traceback
      description: Paste relevant output from `data/failed/*.error.txt` or CLI output.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. v0.1.0, main@abcdef, feature branch

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight checks
      options:
        - label: I removed or anonymized any sensitive financial/PII data.
          required: true
        - label: I verified this issue is not already open.
          required: true
